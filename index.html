<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c12">
  <title>워치 미니게임</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./menu.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body data-state="idle">
  <main id="menu" class="menu">
    <h1 id="site-title">워치 미니게임</h1>
    <div id="carousel" aria-roledescription="carousel">
      <div id="carousel-track">
        <button class="carousel-card slot-0" type="button" aria-hidden="true" tabindex="-1">
          <div class="card-inner">
            <span class="card-icon" aria-hidden="true"></span>
            <strong class="card-title"></strong>
            <span class="card-help"></span>
          </div>
        </button>
        <button id="previous" class="carousel-card slot-1" type="button">
          <div class="card-inner">
            <span id="prev-icon" class="card-icon" aria-hidden="true"></span>
            <strong id="prev-title" class="card-title"></strong>
            <span id="prev-help" class="card-help"></span>
          </div>
        </button>
        <button id="selected-card" class="carousel-card slot-2" type="button">
          <div class="card-inner">
            <span id="card-icon" class="card-icon" aria-hidden="true"></span>
            <strong id="card-title" class="card-title"></strong>
            <span id="card-help" class="card-help"></span>
          </div>
        </button>
        <button id="next" class="carousel-card slot-3" type="button">
          <div class="card-inner">
            <span id="next-icon" class="card-icon" aria-hidden="true"></span>
            <strong id="next-title" class="card-title"></strong>
            <span id="next-help" class="card-help"></span>
          </div>
        </button>
        <button class="carousel-card slot-4" type="button" aria-hidden="true" tabindex="-1">
          <div class="card-inner">
            <span class="card-icon" aria-hidden="true"></span>
            <strong class="card-title"></strong>
            <span class="card-help"></span>
          </div>
        </button>
      </div>
    </div>
    <div class="menu-footer">
      <p id="position" aria-live="polite"></p>
      <button id="favorite" type="button" aria-pressed="false"></button>
    </div>
  </main>
  <section id="settings" class="settings" hidden>
    <h1 id="settings-title"></h1>
    <label for="language" id="language-label"></label>
    <select id="language"><option value="ko">한국어</option><option value="en">English</option></select>
    <label for="theme" id="theme-label"></label>
    <select id="theme"><option value="dark"></option><option value="light"></option><option value="system"></option></select>
    <button id="settings-back" type="button"></button>
  </section>
  <section id="game" hidden aria-label="게임">
    <button id="play" type="button"></button>
    <div class="watch">
      <h1 id="title"></h1>
      <p id="message" role="status" aria-live="polite"></p>
      <p id="action"></p>
      <p id="best"></p>
    </div>
    <button id="back" type="button"></button>
  </section>
</body>
</html>
