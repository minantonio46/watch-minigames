<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c12">
  <title>워치 미니게임</title>
  <link rel="stylesheet" href="./style.css?v=layout-policy-v1">
  <script src="./vendor/embla-carousel.umd.js"></script>
  <script src="./menu.js?v=layout-policy-v1" defer></script>
  <script src="./game.js?v=layout-policy-v1" defer></script>
</head>
<body data-state="idle">
  <main id="menu" class="menu" aria-busy="true">
    <h1 id="site-title">워치 미니게임</h1>
    <div id="carousel" class="embla" aria-roledescription="carousel">
      <div id="carousel-track" class="embla__container">
        <div class="embla__slide is-selected" data-game="reaction">
          <button id="selected-card" class="carousel-card" type="button" aria-label="열기: 반응속도">
            <div class="card-inner">
              <span id="card-icon" class="card-icon" aria-hidden="true">ϟ</span>
              <strong id="card-title" class="card-title">반응속도</strong>
              <span id="card-help" class="card-help">초록색이면 터치</span>
            </div>
          </button>
        </div>
        <div class="embla__slide is-next" data-game="taps">
          <button id="next" class="carousel-card" type="button" aria-label="다음: 10초 연타">
            <div class="card-inner">
              <span id="next-icon" class="card-icon" aria-hidden="true">◎</span>
              <strong id="next-title" class="card-title">10초 연타</strong>
              <span id="next-help" class="card-help">10초 동안 빠르게</span>
            </div>
          </button>
        </div>
        <div class="embla__slide" data-game="timing">
          <button class="carousel-card" type="button">
            <div class="card-inner">
              <span class="card-icon" aria-hidden="true">◷</span>
              <strong class="card-title">5초 맞추기</strong>
              <span class="card-help">나만의 시간 감각</span>
            </div>
          </button>
        </div>
        <div class="embla__slide is-prev" data-game="settings">
          <button id="previous" class="carousel-card" type="button" aria-label="이전: 설정">
            <div class="card-inner">
              <span id="prev-icon" class="card-icon" aria-hidden="true">⚙</span>
              <strong id="prev-title" class="card-title">설정</strong>
              <span id="prev-help" class="card-help">언어 · 화면 테마</span>
            </div>
          </button>
        </div>
      </div>
    </div>
    <div class="menu-footer">
      <p id="position" aria-live="polite"></p>
      <button id="favorite" type="button" aria-pressed="false"></button>
    </div>
  </main>
  <section id="settings" class="settings" hidden>
    <header class="settings-header"><h1 id="settings-title"></h1></header>
    <div class="settings-content">
      <section class="setting-group" aria-labelledby="language-label">
        <h2 id="language-label"></h2>
        <div class="setting-options two-columns">
          <button class="setting-choice" type="button" data-language-choice="ko"><span class="choice-icon" aria-hidden="true">가</span><span class="choice-label" data-ko="한국어" data-en="Korean">한국어</span></button>
          <button class="setting-choice" type="button" data-language-choice="en"><span class="choice-icon" aria-hidden="true">A</span><span class="choice-label" data-ko="영어" data-en="English">영어</span></button>
        </div>
      </section>
      <section class="setting-group" aria-labelledby="theme-label">
        <h2 id="theme-label"></h2>
        <div class="setting-options two-columns">
          <button class="setting-choice" type="button" data-theme-choice="dark"><span class="choice-icon" aria-hidden="true">◐</span><span class="choice-label" data-ko="다크" data-en="Dark">다크</span></button>
          <button class="setting-choice" type="button" data-theme-choice="light"><span class="choice-icon" aria-hidden="true">☀</span><span class="choice-label" data-ko="라이트" data-en="Light">라이트</span></button>
          <button class="setting-choice" type="button" data-theme-choice="system"><span class="choice-icon" aria-hidden="true">⌚</span><span class="choice-label" data-ko="기기 설정" data-en="System">기기 설정</span></button>
          <button class="setting-choice" type="button" data-theme-choice="contrast"><span class="choice-icon" aria-hidden="true">◼</span><span class="choice-label" data-ko="고대비" data-en="Contrast">고대비</span></button>
        </div>
        <p id="contrast-note"></p>
      </section>
      <section class="setting-group records-setting" aria-labelledby="records-label">
        <h2 id="records-label"></h2>
        <button id="reset-records" class="reset-records" type="button"></button>
        <p id="reset-records-status" class="reset-records-status" aria-live="polite"></p>
      </section>
    </div>
    <div id="reset-records-confirm" class="reset-records-modal" hidden role="dialog" aria-modal="true" aria-labelledby="reset-records-warning">
      <div class="reset-records-confirm">
        <p id="reset-records-warning"></p>
        <div class="reset-records-actions">
          <button id="reset-records-cancel" class="reset-records-cancel" type="button"></button>
          <button id="reset-records-confirm-button" class="reset-records-confirm-button" type="button"></button>
          </div>
        </div>
    </div>
    <button id="settings-back" class="menu-return" type="button" aria-label="메뉴로 돌아가기">
      <span class="menu-glyph" aria-hidden="true"></span>
      <span id="settings-back-label"></span>
    </button>
  </section>
  <section id="game" hidden aria-label="게임">
    <button id="play" type="button"></button>
    <div class="watch">
      <h1 id="title"></h1>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="runner-stage" class="runner-stage" hidden aria-label="러너">
        <div id="runner-best" class="runner-best"></div>
        <div id="runner-score" class="runner-score"></div>
        <div id="runner-player" class="runner-player" aria-hidden="true">➤</div>
        <div id="runner-obstacle" class="runner-obstacle" aria-hidden="true">▣</div>
        <div id="runner-obstacle-next" class="runner-obstacle" aria-hidden="true">✚</div>
        <div id="runner-obstacle-tail" class="runner-obstacle" aria-hidden="true">✖</div>
        <div class="runner-ground" aria-hidden="true"></div>
      </div>
      <div id="blackjack-table" class="bj-table" hidden>
        <div class="bj-hand" id="bj-dealer-area">
          <span class="bj-label" id="bj-dealer-label">딜러</span>
          <div class="bj-cards" id="bj-dealer-cards"></div>
          <span class="bj-score" id="bj-dealer-score"></span>
        </div>
        <div class="bj-hand" id="bj-player-area">
          <span class="bj-label" id="bj-player-label">나</span>
          <div class="bj-cards" id="bj-player-cards"></div>
          <span class="bj-score" id="bj-player-score"></span>
        </div>
        <div id="bj-controls" class="bj-controls">
          <div id="bj-bet-controls" class="bj-bet-controls">
            <span id="bj-bankroll" class="bj-bankroll"></span>
            <div class="bj-bet-picker">
              <button id="bj-bet-down" class="bj-btn bj-bet-step" type="button" aria-label="판돈 줄이기">−</button>
              <span id="bj-bet" class="bj-bet" aria-live="polite"></span>
              <button id="bj-bet-up" class="bj-btn bj-bet-step" type="button" aria-label="판돈 늘리기">+</button>
            </div>
          </div>
          <button id="bj-hit" class="bj-btn" type="button">+ 히트</button>
          <button id="bj-stand" class="bj-btn" type="button">스탠드</button>
          <button id="bj-deal" class="bj-btn bj-btn-primary" type="button" hidden>게임 시작</button>
          <button id="bj-continue" class="bj-btn bj-btn-primary" type="button" hidden>이어하기</button>
          <button id="bj-new" class="bj-btn" type="button" hidden>기록 후 새로하기</button>
        </div>
      </div>
      <p id="action"></p>
      <div id="game-meta" class="game-meta">
        <span id="bj-round-meta" class="bj-round-meta" hidden></span>
        <p id="best"></p>
      </div>
    </div>
    <button id="back" type="button" aria-label="메뉴로 돌아가기">
      <span class="menu-glyph" aria-hidden="true"></span>
      <span id="back-label"></span>
    </button>
  </section>
</body>
</html>
