<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c12">
  <title>워치 미니게임</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body data-state="idle">
  <button id="play" type="button" aria-label="화면 어디나 눌러 시작"></button>
  <main class="watch">
    <p class="eyebrow">WATCH MINIGAMES</p>
    <h1>반응속도</h1>
    <p id="message" role="status" aria-live="polite">초록색이 되면 터치!</p>
    <p id="action">화면을 눌러 시작</p>
    <p id="best">최고 기록 —</p>
    <p class="hint">화면 어디나 터치</p>
  </main>
</body>
</html>
