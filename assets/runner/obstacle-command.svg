<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="m">
      <rect fill="#fff" width="100" height="100"/>

      <circle fill="#000" cx="20" cy="20" r="10"/>
      <circle fill="#000" cx="80" cy="20" r="10"/>
      <circle fill="#000" cx="20" cy="80" r="10"/>
      <circle fill="#000" cx="80" cy="80" r="10"/>

      <rect x="20" y="20" width="10" height="10"/>
      <rect x="70" y="20" width="10" height="10"/>
      <rect x="20" y="70" width="10" height="10"/>
      <rect x="70" y="70" width="10" height="10"/>
    </mask>
  </defs>

  <g mask="url(#m)" fill="#fff">
  
    <circle cx="20" cy="20" r="20"/>
    <circle cx="80" cy="20" r="20"/>
    <circle cx="20" cy="80" r="20"/>
    <circle cx="80" cy="80" r="20"/>

    <rect x="30" y="20" width="10" height="60"/>
    <rect x="60" y="20" width="10" height="60"/>
    <rect x="20" y="30" width="60" height="10"/>
    <rect x="20" y="60" width="60" height="10"/>

    <!-- 0 10 [20] 30 40 - 60 70 [80] 90 100 -->
  </g>
</svg>
