<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="m">
      <rect fill="#fff" width="100" height="100"/>
      <!-- 루프 중심 구멍 4개 -->
      <circle fill="#000" cx="25" cy="25" r="9"/>
      <circle fill="#000" cx="75" cy="25" r="9"/>
      <circle fill="#000" cx="25" cy="75" r="9"/>
      <circle fill="#000" cx="75" cy="75" r="9"/>
    </mask>
  </defs>

  <!-- 4개 루프(채움 원) + 연결바를 하나의 그룹으로 마스크 적용 -->
  <g mask="url(#m)" fill="#fff">
    <!-- 루프: 외경 20, 중심 (25,25)(75,25)(25,75)(75,75) -->
    <circle cx="25" cy="25" r="20"/>
    <circle cx="75" cy="25" r="20"/>
    <circle cx="25" cy="75" r="20"/>
    <circle cx="75" cy="75" r="20"/>
    <!-- 연결바: 루프 외경 접선(45)에서 상대 루프 접선(55)까지, 높이=링두께(11) -->
    <rect x="45" y="19.5" width="10" height="11"/>
    <rect x="45" y="69.5" width="10" height="11"/>
    <rect x="19.5" y="45" width="11" height="10"/>
    <rect x="69.5" y="45" width="11" height="10"/>
  </g>
</svg>
